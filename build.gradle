plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'harddayz-forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (project.hasProperty('droneFxSmokeTest')) {
                workingDirectory project.file('build/drone-fx-smoke-run')
                property 'harddayz.droneFxSmokeTest', 'true'
                mods { "${mod_id}" { source sourceSets.test } }
            }
            if (project.hasProperty('modelSmokeTest')) {
                workingDirectory project.file('build/model-smoke-run')
                property 'harddayz.modelSmokeTest', 'true'
                mods { "${mod_id}" { source sourceSets.test } }
            }
            if (project.hasProperty('gpuSmokeTest')) {
                workingDirectory project.file('build/gpu-smoke-run')
                property 'harddayz.gpuSmokeTest', 'true'
                mods {
                    "${mod_id}" { source sourceSets.test }
                }
            }
        }

        server {
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('build/gametest-run')
            mods {
                "${mod_id}" {
                    source sourceSets.test
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// миксин: сущности вокруг дрона видны пилоту (см. TrackedEntityMixin)
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    if (project.hasProperty('oculus')) {
        runtimeOnly fg.deobf('maven.modrinth:oculus:iQ1SwGc3')
        runtimeOnly fg.deobf('maven.modrinth:embeddium:UTbfe5d1')
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_version: mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'MixinConfigs'          : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}
